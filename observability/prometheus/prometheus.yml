global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: gateway-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway-service:8080

  - job_name: auth-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8081

  - job_name: reminder-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - reminder-service:8082

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - notification-service:8083

  # RabbitMQ's bundled Prometheus plugin; queue_coarse_metrics gives ready/unacked counts per queue.
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family:
        - queue_coarse_metrics
    static_configs:
      - targets:
          - rabbitmq:15692
