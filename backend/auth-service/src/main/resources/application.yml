server:
  port: 8081

spring:
  application:
    name: auth-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/notifyhub_auth}
    username: ${AUTH_DB_USERNAME:notifyhub}
    password: ${AUTH_DB_PASSWORD:notifyhub}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

notifyhub:
  auth:
    jwt:
      issuer: ${AUTH_JWT_ISSUER:notifyhub-auth}
      secret: ${AUTH_JWT_SECRET}
      expiration: ${AUTH_JWT_EXPIRATION:PT2H}
    login-throttle:
      redis-enabled: ${LOGIN_THROTTLE_REDIS_ENABLED:false}
      max-failures: ${LOGIN_THROTTLE_MAX_FAILURES:5}
      window: ${LOGIN_THROTTLE_WINDOW:PT15M}

management:
  health:
    redis:
      enabled: ${LOGIN_THROTTLE_REDIS_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
