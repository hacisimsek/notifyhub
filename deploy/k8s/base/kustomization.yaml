apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: notifyhub

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - rabbitmq.yaml
  - kafka.yaml
  - backend-services.yaml
  - dashboard.yaml
  - observability.yaml

# Secrets come from the git-ignored secrets.env; copy secrets.env.example and replace the values.
secretGenerator:
  - name: notifyhub-secrets
    envs:
      - secrets.env
    options:
      labels:
        app.kubernetes.io/part-of: notifyhub

# Copy of observability/grafana; scripts/k8s-local-verify.sh fails if the two drift apart.
configMapGenerator:
  - name: grafana-dashboards
    files:
      - grafana/dashboards.yml
      - grafana/notifyhub-overview.json
    options:
      labels:
        app.kubernetes.io/part-of: notifyhub
